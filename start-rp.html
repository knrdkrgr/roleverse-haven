<!DOCTYPE html>
<html>
<head>
    <title>Start Roleplay - Roleverse Haven</title>
</head>

<body>

    <header>
        <h1>Roleverse Haven</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="characters.html">Characters</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
        </nav>
    </header>

    <main>

        <h2>Start a Roleplay</h2>

        <p>Set up your roleplay before you begin.</p>

        <form>

            <label>Your Character</label>

            <select>
                <option>Select a character</option>
                <option>Character Name</option>
                <option>Another Character</option>
            </select>

            <br><br>

            <label>Partner Character</label>

            <p>Character Name</p>

            <br>

            <label>RP Type</label>

            <select>
                <option>Private</option>
                <option>Public</option>
            </select>

            <br><br>

            <label>Genre</label>

            <select>
                <option>Fantasy</option>
                <option>Modern</option>
                <option>Romance</option>
                <option>Historical</option>
                <option>Science Fiction</option>
                <option>Horror</option>
                <option>Other</option>
            </select>

            <br><br>

            <label>Plot / Premise</label>

            <br>

            <textarea placeholder="Describe the roleplay plot or premise..."></textarea>

            <br><br>

            <label>Opening Message</label>

            <br>

            <textarea placeholder="Write the opening message for the roleplay..."></textarea>

            <br><br>

            <button type="submit">Start Roleplay</button>

        </form>

        <br>

        <a href="character.html">Cancel</a>

    </main>

</body>
</html>
