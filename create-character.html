<!DOCTYPE html>
<html>
<head>
    <title>Create Character - Roleverse Haven</title>
</head>

<body>

    <header>
        <h1>Roleverse Haven</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="characters.html">Characters</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
        </nav>
    </header>

    <main>

        <h2>Create a Character</h2>

        <p>Create your next roleplay character.</p>

        <form>

            <label>Character Avatar</label>
            <input type="file" accept="image/*">

            <br><br>

            <label>Character Name</label>
            <input type="text" placeholder="Enter character name">

            <br><br>

            <label>Age</label>
            <input type="number" placeholder="Enter age">

            <br><br>

            <label>Pronouns</label>
            <input type="text" placeholder="e.g. she/her, he/him, they/them">

            <br><br>

            <label>Genre</label>
            <select>
                <option>Fantasy</option>
                <option>Modern</option>
                <option>Romance</option>
                <option>Historical</option>
                <option>Science Fiction</option>
                <option>Horror</option>
                <option>Psychological</option>
                <option>Sci-Fi</option>
                <option>Militar</option>
                <option>Other</option>
            </select>

            <br><br>

            <label>Fandom / Universe</label>
            <input type="text" placeholder="e.g. Original Character, Harry Potter, Marvel">

            <br><br>

            <label>Occupation / Role</label>
            <input type="text" placeholder="e.g. Knight, Detective, Student">

            <br><br>

            <label>Personality</label>
            <textarea placeholder="Describe your character's personality..."></textarea>

            <br><br>

            <label>Biography</label>
            <textarea placeholder="Tell us about your character..."></textarea>

            <br><br>

            <button type="submit">Create Character</button>

        </form>

        <br>

        <a href="characters.html">Cancel</a>

    </main>

</body>
</html>
