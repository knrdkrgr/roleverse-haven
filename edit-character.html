<!DOCTYPE html>
<html>
<head>
    <title>Edit Character - Roleverse Haven</title>
</head>

<body>

    <header>
        <h1>Roleverse Haven</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="characters.html">Characters</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
        </nav>
    </header>

    <main>

        <h2>Edit Character</h2>

        <p>Update your character information.</p>

        <form>

            <label>Character Avatar</label>
            <input type="file" accept="image/*">

            <br><br>

            <label>Character Name</label>
            <input type="text" value="Character Name">

            <br><br>

            <label>Age</label>
            <input type="number" value="25">

            <br><br>

            <label>Pronouns</label>
            <input type="text" value="She/Her">

            <br><br>

            <label>Genre</label>
            <select>
                <option>Fantasy</option>
                <option>Modern</option>
                <option>Romance</option>
                <option>Historical</option>
                <option>Science Fiction</option>
                <option>Horror</option>
                <option>Other</option>
            </select>

            <br><br>

            <label>Fandom / Universe</label>
            <input type="text" value="Original Character">

            <br><br>

            <label>Occupation / Role</label>
            <input type="text" value="Warrior">

            <br><br>

            <label>Personality</label>
            <textarea>A short description of the character's personality.</textarea>

            <br><br>

            <label>Biography</label>
            <textarea>This is the character's background and story.</textarea>

            <br><br>

            <button type="submit">Save Changes</button>

        </form>

        <br>

        <a href="character.html">Cancel</a>

    </main>

</body>
</html>
