<!DOCTYPE html>
<html>
<head>
    <title>Create an Account - Roleverse Haven</title>
</head>

<body>
    <h1>Create an Account</h1>

    <p>Join Roleverse Haven and create your own roleplaying profile</p>

    <form>
        <label>Username</label>
        <input type="text">

        <br><br>

        <label>Email</label>
        <input type="email">

        <br><br>

        <label>Password</label>
        <input type="password">

        <br><br>

        <label>Confirm Password</label>
        <input type="password">

        <br><br>

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account? <a href="login.html">Log In</a></p>

    <a href="index.html">Back to Home</a>
</body>
</html>
