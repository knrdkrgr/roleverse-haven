<!DOCTYPE html>
<html>
<head>
    <title>Create Group - Roleverse Haven</title>
</head>

<body>

    <header>
        <h1>Roleverse Haven</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="characters.html">Characters</a>
            <a href="groups.html">Groups</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
        </nav>
    </header>

    <main>

        <h2>Create a Group</h2>

        <p>
            Create your own community for roleplayers and writers.
        </p>

        <form>

            <label>Group Name</label>
            <input type="text" placeholder="Enter group name">

            <br><br>

            <label>Group Avatar</label>
            <input type="file" accept="image/*">

            <br><br>

            <label>Cover Photo</label>
            <input type="file" accept="image/*">

            <br><br>

            <label>Category</label>
            <select>
                <option>Roleplay</option>
                <option>Fandom</option>
                <option>Writing</option>
                <option>Character Development</option>
                <option>Art & Media</option>
                <option>General</option>
                <option>Other</option>
            </select>

            <br><br>

            <label>Privacy</label>

            <br>

            <input type="radio" name="privacy" value="public">
            <label>Public</label>

            <br>

            <input type="radio" name="privacy" value="private">
            <label>Private</label>

            <br><br>

            <label>Group Description</label>

            <br>

            <textarea placeholder="Tell people what your group is about..."></textarea>

            <br><br>

            <label>Group Rules</label>

            <br>

            <textarea placeholder="Write the rules for your group..."></textarea>

            <br><br>

            <button type="submit">Create Group</button>

        </form>

        <br>

        <a href="groups.html">Cancel</a>

    </main>

</body>
</html>
